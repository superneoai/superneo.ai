name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The runner image already provides the shared libraries Chromium needs, so
      # this skips apt and only downloads the browser Playwright launches in tests.
      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test and build static site
        run: npm test
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com
          VITE_POSTHOG_IP_DISCARD_CONFIRMED: ${{ vars.POSTHOG_IP_DISCARD_CONFIRMED }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  # The scene baseline was recorded on macOS, and CoreText lays the wordmark out a
  # few pixels differently from FreeType, so this runs on the platform it targets.
  # Standard runners are free for public repositories.
  visual:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      # Performance figures describe the recording machine's display, and the glow
      # wave is sampled on a timer, so the runner checks the deterministic parts:
      # layout, the NEO mask, boot frames, fault handling and reduced motion.
      - name: Verify the scene
        run: npm run test:visual -- --browsers=chromium --skip-performance --skip-pulse

  security:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, visual, security]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
